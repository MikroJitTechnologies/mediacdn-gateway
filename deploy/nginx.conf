# TLS + cache in front of mediacdn-gateway (:8090) and, optionally, imgproxy (:8080) for legacy signed URLs.
proxy_cache_path /var/cache/nginx/mediacdn levels=1:2 keys_zone=mediacdn:20m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 443 ssl;
    server_name media.example.com;
    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    location = / { return 404; }

    location /t/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache mediacdn;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }
}
